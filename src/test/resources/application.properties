# API Testing Configuration
# This file contains configuration properties for API testing

# Environment Selection (dev, staging, prod)
environment=dev

# API Base URLs
api.base.url.dev=https://jsonplaceholder.typicode.com
api.base.url.staging=https://jsonplaceholder.typicode.com
api.base.url.prod=https://jsonplaceholder.typicode.com

# Timeouts (in seconds)
socket.timeout=30
connection.timeout=30
request.timeout=60

# Logging
logging.level=INFO
logging.enabled=true

# Request/Response
request.log.enabled=true
response.log.enabled=true

# Default Headers
default.content.type=application/json
default.accept.type=application/json

# Retry Configuration
max.retry.attempts=3
retry.delay.ms=1000

# Test Data
test.user.id=1
test.post.id=1
